# Брокер RabbitMQ: StatefulSet из одного Pod (rabbitmq-0) с постоянным томом.
# Имя узла rabbit@rabbitmq-0 стабильно при пересоздании Pod, поэтому durable-очереди и persistent-сообщения
# в томе переживают удаление Pod (как том transit-rabbitmq-data в ЛР 4).
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  namespace: transit
data:
  90-transit.conf: |
    # статистика очередей в веб-консоли и HTTP API обновляется раз в 1 с (по умолчанию 5 с)
    collect_statistics_interval = 1000
---
apiVersion: v1
kind: Service                     # внутренний адрес rabbitmq:5672 для шлюза и обработчиков
metadata:
  name: rabbitmq
  namespace: transit
  labels: {app: rabbitmq}
spec:
  selector: {app: rabbitmq}
  ports:
    - {name: amqp, port: 5672, targetPort: amqp}
    - {name: management, port: 15672, targetPort: management}
---
apiVersion: v1
kind: Service                     # веб-консоль и HTTP API с хоста (kind: порт 31672 узла → localhost:15672)
metadata:
  name: rabbitmq-management
  namespace: transit
  labels: {app: rabbitmq}
spec:
  type: NodePort
  selector: {app: rabbitmq}
  ports:
    - {name: management, port: 15672, targetPort: management, nodePort: 31672}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: transit
  labels: {app: rabbitmq, app.kubernetes.io/part-of: transit-monitor, tier: broker}
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels: {app: rabbitmq}
  template:
    metadata:
      labels: {app: rabbitmq, tier: broker}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: rabbitmq
          image: rabbitmq:4.1-management
          imagePullPolicy: IfNotPresent
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom: {secretKeyRef: {name: transit-secret, key: RABBITMQ_USER}}
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: {secretKeyRef: {name: transit-secret, key: RABBITMQ_PASSWORD}}
          ports:
            - {name: amqp, containerPort: 5672}
            - {name: management, containerPort: 15672}
          volumeMounts:
            - {name: data, mountPath: /var/lib/rabbitmq}
            - {name: config, mountPath: /etc/rabbitmq/conf.d/90-transit.conf, subPath: 90-transit.conf}
          readinessProbe:
            # ЛР 6: было exec rabbitmq-diagnostics check_port_connectivity – каждый вызов запускает отдельную
            # виртуальную машину Erlang (CLI) и в простое занимал ≈0,8 ядра; проверка порта AMQP почти бесплатна
            tcpSocket: {port: 5672}
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec: {command: [rabbitmq-diagnostics, -q, ping]}
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 15
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits: {memory: 1Gi}
      volumes:
        - name: config
          configMap: {name: rabbitmq-config}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 1Gi}
