# Конфиденциальные параметры: учетные данные брокера и БД и строки подключения, содержащие пароль.
# Значения учебного стенда (как в .env.example); для реального кластера секрет создается вне репозитория:
#   kubectl -n transit create secret generic transit-secret --from-env-file=secret.env
# stringData – открытый текст в манифесте, API-сервер хранит его в data в кодировке base64.
apiVersion: v1
kind: Secret
metadata:
  name: transit-secret
  namespace: transit
  labels:
    app.kubernetes.io/part-of: transit-monitor
type: Opaque
stringData:
  RABBITMQ_USER: transit
  RABBITMQ_PASSWORD: transit
  POSTGRES_USER: transit
  POSTGRES_PASSWORD: transit
  RABBIT_URL: amqp://transit:transit@rabbitmq:5672/
  DB_DSN: postgresql://transit:transit@postgres:5432/transit
