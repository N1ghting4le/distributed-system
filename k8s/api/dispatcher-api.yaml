# Dispatcher API – REST-доступ к результатам обработки. Внутри кластера – http://dispatcher-api:8081,
# с хоста – NodePort 30081 (kind пробрасывает на localhost:8081).
apiVersion: v1
kind: Service
metadata:
  name: dispatcher-api
  namespace: transit
  labels: {app: dispatcher-api}
spec:
  type: NodePort
  selector: {app: dispatcher-api}
  ports:
    - {name: http, port: 8081, targetPort: http, nodePort: 30081}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatcher-api
  namespace: transit
  labels: {app: dispatcher-api, app.kubernetes.io/part-of: transit-monitor, tier: api}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app: dispatcher-api}
  template:
    metadata:
      labels: {app: dispatcher-api, tier: api}
    spec:
      containers:
        - name: dispatcher-api
          image: transit-monitor/dispatcher-api:lab5
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: transit-config}
          env:
            - name: DB_DSN
              valueFrom: {secretKeyRef: {name: transit-secret, key: DB_DSN}}
          ports:
            - {name: http, containerPort: 8081}
          readinessProbe:                    # /health проверяет БД: при ее отказе Pod исключается из Service
            httpGet: {path: /health, port: http}
            periodSeconds: 3
            failureThreshold: 2
          livenessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
