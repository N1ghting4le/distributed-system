# Хранилище PostgreSQL 17: StatefulSet из одного Pod (postgres-0) с постоянным томом.
# Скрипты database/init (001–003) монтируются из ConfigMap postgres-init (init-sql.yaml)
# и выполняются один раз – при пустом томе, как в docker compose ЛР 4.
apiVersion: v1
kind: Service                     # внутренний адрес postgres:5432 для обработчиков и Dispatcher API
metadata:
  name: postgres
  namespace: transit
  labels: {app: postgres}
spec:
  selector: {app: postgres}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
---
apiVersion: v1
kind: Service                     # доступ стенда экспериментов с хоста (kind: порт 30433 узла → localhost:5433)
metadata:
  name: postgres-external
  namespace: transit
  labels: {app: postgres}
spec:
  type: NodePort
  selector: {app: postgres}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres, nodePort: 30433}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: transit
  labels: {app: postgres, app.kubernetes.io/part-of: transit-monitor, tier: database}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres, tier: database}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: postgres
          image: postgres:17
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: transit-secret, key: POSTGRES_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: transit-secret, key: POSTGRES_PASSWORD}}
            - name: POSTGRES_DB
              valueFrom: {configMapKeyRef: {name: transit-config, key: POSTGRES_DB}}
            - name: TZ
              valueFrom: {configMapKeyRef: {name: transit-config, key: TZ}}
            - name: PGDATA            # подкаталог: корень тома может содержать служебные файлы провайдера
              value: /var/lib/postgresql/data/pgdata
          ports:
            - {name: postgres, containerPort: 5432}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
          readinessProbe:
            exec: {command: [sh, -c, 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"']}
            initialDelaySeconds: 5
            periodSeconds: 3
          livenessProbe:
            exec: {command: [sh, -c, 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"']}
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {memory: 1Gi}
      volumes:
        - name: init
          configMap: {name: postgres-init}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 2Gi}
