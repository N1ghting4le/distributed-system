# Скрипты инициализации БД из database/init (сгенерировано, не редактировать вручную):
#   kubectl create configmap postgres-init -n transit --from-file=database/init --dry-run=client -o yaml
apiVersion: v1
data:
  001_schema.sql: "-- Схема хранилища системы мониторинга городского транспорта (ЛР
    1, дополнена в ЛР 2).\r\n-- Применяется вручную (ЛР 2), затем контейнером PostgreSQL
    при первом запуске (ЛР 4).\r\n\r\nCREATE SCHEMA IF NOT EXISTS transit;\r\nSET
    search_path TO transit;\r\n\r\n-- ---------- Справочные данные (загружаются из
    ГИС перевозчика, только чтение для сервисов) ----------\r\nCREATE TABLE routes
    (\r\n    route_id       varchar(8)  PRIMARY KEY,\r\n    transport_type varchar(10)
    NOT NULL CHECK (transport_type IN ('bus', 'trolleybus', 'tram')),\r\n    name
    \          text        NOT NULL\r\n);\r\n\r\nCREATE TABLE stops (\r\n    stop_id
    varchar(8)       PRIMARY KEY,\r\n    name    text             NOT NULL,\r\n    lat
    \    double precision NOT NULL,\r\n    lon     double precision NOT NULL\r\n);\r\n\r\nCREATE
    TABLE route_stops (\r\n    route_id  varchar(8) REFERENCES routes,\r\n    direction
    char(1)    CHECK (direction IN ('A', 'B')),\r\n    stop_seq  smallint,\r\n    stop_id
    \  varchar(8) NOT NULL REFERENCES stops,\r\n    planned_offset_s integer NOT NULL,
    \  -- плановое прибытие от начала рейса, с (ЛР 2)\r\n    PRIMARY KEY (route_id,
    direction, stop_seq)\r\n);\r\n\r\nCREATE TABLE route_shapes (            -- геометрия
    маршрута: массив точек [[lat, lon], ...]\r\n    route_id  varchar(8) REFERENCES
    routes,\r\n    direction char(1)    CHECK (direction IN ('A', 'B')),\r\n    points
    \   jsonb      NOT NULL,\r\n    PRIMARY KEY (route_id, direction)\r\n);\r\n\r\nCREATE
    TABLE trips (                   -- рейсы расписания на текущие сутки\r\n    trip_id
    \      varchar(16) PRIMARY KEY,\r\n    route_id      varchar(8)  NOT NULL REFERENCES
    routes,\r\n    direction     char(1)     NOT NULL CHECK (direction IN ('A', 'B')),\r\n
    \   planned_start timestamptz NOT NULL\r\n);\r\n\r\nCREATE TABLE timetable (\r\n
    \   trip_id         varchar(16) REFERENCES trips,\r\n    stop_id         varchar(8)
    \ REFERENCES stops,\r\n    planned_arrival timestamptz NOT NULL,\r\n    PRIMARY
    KEY (trip_id, stop_id)\r\n);\r\n\r\n-- Учебное расписание на сутки day: рейсы
    в обоих направлениях каждые headway_min минут круглые сутки,\r\n-- плановое прибытие
    = начало рейса + route_stops.planned_offset_s. Повторный вызов за те же сутки
    ничего не меняет.\r\nCREATE FUNCTION build_timetable(day date, headway_min integer
    DEFAULT 3) RETURNS integer\r\nLANGUAGE plpgsql AS $$\r\nDECLARE n integer;\r\nBEGIN\r\n
    \   IF EXISTS (SELECT 1 FROM trips WHERE (planned_start AT TIME ZONE 'Europe/Minsk')::date
    = day) THEN\r\n        RETURN 0;\r\n    END IF;\r\n    DELETE FROM timetable;\r\n
    \   DELETE FROM trips;\r\n    INSERT INTO trips (trip_id, route_id, direction,
    planned_start)\r\n    SELECT d.route_id || '-' || d.direction || '-' || to_char(g,
    'HH24MI'), d.route_id, d.direction,\r\n           g AT TIME ZONE 'Europe/Minsk'\r\n
    \   FROM (SELECT DISTINCT route_id, direction FROM route_stops) d,\r\n         generate_series(day::timestamp,
    day::timestamp + interval '1 day' - interval '1 minute',\r\n                         make_interval(mins
    => headway_min)) g;\r\n    GET DIAGNOSTICS n = ROW_COUNT;\r\n    INSERT INTO timetable
    (trip_id, stop_id, planned_arrival)\r\n    SELECT t.trip_id, rs.stop_id, t.planned_start
    + make_interval(secs => rs.planned_offset_s)\r\n    FROM trips t JOIN route_stops
    rs USING (route_id, direction);\r\n    RETURN n;\r\nEND $$;\r\n\r\n-- ----------
    Track Service ----------\r\nCREATE TABLE vehicle_positions (       -- трек: ~6,2
    млн строк в сутки, секционирование по суткам\r\n    message_id  uuid             NOT
    NULL,\r\n    vehicle_id  varchar(9)       NOT NULL,\r\n    route_id    varchar(8)
    \      NOT NULL,\r\n    trip_id     varchar(16)      NOT NULL,\r\n    recorded_at
    timestamptz      NOT NULL,\r\n    received_at timestamptz      NOT NULL,\r\n    lat
    \        double precision NOT NULL,\r\n    lon         double precision NOT NULL,\r\n
    \   speed_kmh   real             NOT NULL,\r\n    heading     smallint         NOT
    NULL,\r\n    doors_open  boolean          NOT NULL,\r\n    PRIMARY KEY (recorded_at,
    message_id)\r\n) PARTITION BY RANGE (recorded_at);\r\nCREATE INDEX ON vehicle_positions
    (vehicle_id, recorded_at);\r\nCREATE TABLE vehicle_positions_default PARTITION
    OF vehicle_positions DEFAULT;\r\n\r\n-- Секция трека за сутки day (UTC); Track
    Service создает секции на сегодня и завтра при запуске.\r\nCREATE FUNCTION create_positions_partition(day
    date) RETURNS void\r\nLANGUAGE plpgsql AS $$\r\nBEGIN\r\n    EXECUTE format('CREATE
    TABLE IF NOT EXISTS %I PARTITION OF vehicle_positions FOR VALUES FROM (%L) TO
    (%L)',\r\n                   'vehicle_positions_' || to_char(day, 'YYYYMMDD'),
    day::timestamp AT TIME ZONE 'UTC',\r\n                   (day + 1)::timestamp
    AT TIME ZONE 'UTC');\r\nEND $$;\r\n\r\nCREATE TABLE vehicle_state (           --
    последнее известное положение каждой машины\r\n    vehicle_id  varchar(9)       PRIMARY
    KEY,\r\n    route_id    varchar(8)       NOT NULL,\r\n    trip_id     varchar(16)
    \     NOT NULL,\r\n    recorded_at timestamptz      NOT NULL,\r\n    lat         double
    precision NOT NULL,\r\n    lon         double precision NOT NULL,\r\n    speed_kmh
    \  real             NOT NULL,\r\n    off_route   boolean          NOT NULL DEFAULT
    false,\r\n    updated_at  timestamptz      NOT NULL DEFAULT now()\r\n);\r\n\r\n--
    ---------- Schedule Analytics Service ----------\r\nCREATE TABLE stop_arrivals
    (\r\n    trip_id     varchar(16) NOT NULL,\r\n    stop_id     varchar(8)  NOT
    NULL,\r\n    vehicle_id  varchar(9)  NOT NULL,\r\n    arrived_at  timestamptz
    NOT NULL,\r\n    planned_at  timestamptz NOT NULL,\r\n    delay_s     integer
    \    GENERATED ALWAYS AS (extract(epoch FROM arrived_at - planned_at)::integer)
    STORED,\r\n    PRIMARY KEY (trip_id, stop_id)\r\n);\r\n\r\nCREATE TABLE passenger_flow
    (          -- агрегаты валидаций по 15-минутным интервалам\r\n    route_id     varchar(8)
    \ NOT NULL,\r\n    stop_id      varchar(8)  NOT NULL,\r\n    bucket_start timestamptz
    NOT NULL,\r\n    accepted     integer     NOT NULL DEFAULT 0,\r\n    rejected
    \    integer     NOT NULL DEFAULT 0,\r\n    PRIMARY KEY (route_id, stop_id, bucket_start)\r\n);\r\n\r\n--
    ---------- Incident Service ----------\r\nCREATE TABLE incidents (\r\n    incident_id
    \  bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\r\n    message_id    uuid
    \            NOT NULL UNIQUE,\r\n    incident_type varchar(20)      NOT NULL,\r\n
    \   severity      varchar(8)       NOT NULL CHECK (severity IN ('critical', 'high',
    'medium', 'low')),\r\n    priority      smallint         NOT NULL CHECK (priority
    BETWEEN 1 AND 4),\r\n    detected_by   varchar(20)      NOT NULL,\r\n    vehicle_id
    \   varchar(9)       NOT NULL,\r\n    route_id      varchar(8)       NOT NULL,\r\n
    \   trip_id       varchar(16),\r\n    lat           double precision NOT NULL,\r\n
    \   lon           double precision NOT NULL,\r\n    occurred_at   timestamptz
    \     NOT NULL,\r\n    details       jsonb            NOT NULL DEFAULT '{}',\r\n
    \   status        varchar(12)      NOT NULL DEFAULT 'new' CHECK (status IN ('new',
    'acknowledged', 'closed')),\r\n    correlated_to bigint REFERENCES incidents    --
    повтор того же инцидента той же машины в течение 5 мин\r\n);\r\nCREATE INDEX ON
    incidents (status, priority, occurred_at);\r\n\r\n-- ---------- Общие служебные
    таблицы ----------\r\nCREATE TABLE processed_messages (      -- журнал обработки
    (ЛР 2) и идемпотентность потребителей (ЛР 3)\r\n    consumer     varchar(20) NOT
    NULL,     -- сервис: track-service, analytics-service, incident-service\r\n    message_id
    \  uuid        NOT NULL,\r\n    instance_id  varchar(40),              -- экземпляр
    сервиса (CONSUMER_ID) – для проверки распределения нагрузки\r\n    msg_type     varchar(20),\r\n
    \   produced_at  timestamptz,              -- received_at сообщения: момент публикации
    шлюзом\r\n    processed_at timestamptz NOT NULL DEFAULT now(),   -- задается потребителем
    по своим часам\r\n    result       varchar(32),\r\n    PRIMARY KEY (consumer,
    message_id)\r\n);\r\n\r\nCREATE TABLE rejected_messages (       -- сообщения,
    не прошедшие проверку структуры и значений\r\n    id          bigint GENERATED
    ALWAYS AS IDENTITY PRIMARY KEY,\r\n    consumer    varchar(20) NOT NULL,\r\n    message_id
    \ uuid,\r\n    raw         jsonb       NOT NULL,\r\n    reason      text        NOT
    NULL,\r\n    received_at timestamptz NOT NULL DEFAULT now()\r\n);\r\n"
